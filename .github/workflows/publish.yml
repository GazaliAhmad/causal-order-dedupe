name: Publish Package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type-check the repo
        run: npm run check

      - name: Prepare publishable package
        run: npm run prepare:dist

      - name: Preview tarball contents
        run: npm pack --dry-run ./publish-dist

      - name: Publish package
        run: npm publish ./publish-dist --access public
